name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check package requirements
        run: python -m pip check
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Unit, CLI and offline-security tests
        run: pytest --cov=mcp_contract_guard --cov-report=term-missing --cov-report=xml
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke test installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/mcp-contract-guard" --version
          "$RUNNER_TEMP/wheel-smoke/bin/mcp-contract-guard" validate "$GITHUB_WORKSPACE/examples/before.json" --fixtures "$GITHUB_WORKSPACE/examples/cases.json"
      - name: Run compatible demo
        run: mcp-contract-guard compare examples/before.json examples/after-compatible.json --fixtures examples/cases.json --fail-on warning
      - name: Confirm breaking demo fails the gate
        shell: bash
        run: |
          set +e
          mcp-contract-guard compare examples/before.json examples/after-breaking.json --fixtures examples/cases.json
          status=$?
          set -e
          test "$status" -eq 1
      - name: Save coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore
